name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a stable semantic version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' 'Release tags must use vMAJOR.MINOR.PATCH without prerelease suffixes.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  checks:
    needs: release-metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  publish:
    name: Publish ${{ matrix.target }}
    needs: [release-metadata, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/artcc/personal-finance-${{ matrix.target }}:${{ needs.release-metadata.outputs.version }}
            ghcr.io/artcc/personal-finance-${{ matrix.target }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}
      - name: Record published digest
        env:
          IMAGE: ghcr.io/artcc/personal-finance-${{ matrix.target }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          printf '### %s\n\nTag: `%s`\n\nDigest: `%s@%s`\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
